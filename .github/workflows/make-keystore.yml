name: Make signing key (run ONCE)
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -alias forge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Forge, O=Forge, C=PK"
          base64 -w0 release.jks > KEYSTORE_BASE64.txt
          echo -n "$PASS" > KEYSTORE_PASSWORD.txt
          echo -n "forge" > KEY_ALIAS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-SAVE-THIS-PRIVATELY
          path: |
            release.jks
            KEYSTORE_BASE64.txt
            KEYSTORE_PASSWORD.txt
            KEY_ALIAS.txt
