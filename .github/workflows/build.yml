name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - run: npm install
      - run: npx cap add android

      - name: Target Android 16 (API 36) and bump version
        run: |
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Allow notifications (Android 13+)
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - run: npx cap sync android

      - name: Build APK (testing) and AAB (Play Store)
        run: cd android && ./gradlew assembleDebug bundleRelease

      - name: Sign the AAB
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: forge-apk-for-testing
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: forge-aab-for-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
